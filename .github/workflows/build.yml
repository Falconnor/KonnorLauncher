# CI de Konnor Launcher (monorepo).
# - launcher: pruebas, publicación y paquete de Velopack en cada push/PR a main.
#   Con una etiqueta v<versión> (la de Launcher/Directory.Build.props), además publica la release en GitHub:
#   instalador (KonnorLauncher-win-Setup.exe), paquetes de actualización (completo y delta) y las herramientas del
#   servidor. El launcher instalado busca sus actualizaciones en esas releases.
# - servidor: comprueba que el servidor se instala y que su código compila.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  launcher:
    runs-on: windows-latest
    permissions:
      contents: write # crear la release (solo se usa con etiquetas)
    defaults:
      run:
        shell: pwsh
        working-directory: Launcher
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Launcher/global.json

      # La etiqueta tiene que ser la versión del proyecto: si no, el launcher no reconocería la actualización.
      - name: Comprobar la versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "La etiqueta ${{ github.ref_name }} no coincide con la versión $version de Directory.Build.props." }

      - name: Pruebas, publicación y paquete
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./build.ps1

      - name: Pruebas, publicación y release en GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.ps1 -Upload

      - uses: actions/upload-artifact@v4
        with:
          name: KonnorLauncher
          path: |
            Launcher/artifacts/velopack/KonnorLauncher-win-Setup.exe
            Launcher/artifacts/velopack/KonnorLauncher-win-Portable.zip
            Launcher/artifacts/*.zip

  servidor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LauncherBackEnd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencias y compilación
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q main.py Services Panel
          python -c "import main, Panel.app"
