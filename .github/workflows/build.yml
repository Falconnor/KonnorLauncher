# CI de Konnor Launcher (monorepo).
# - launcher: pruebas, publicación e instalador en cada push/PR a main y en etiquetas v*.
# - backend: comprueba que el backend se instala y que su código compila.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  launcher:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: Launcher
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Launcher/global.json

      - name: Instalar Inno Setup
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $found) { choco install innosetup -y --no-progress }

      - name: Pruebas, publicación e instalador
        run: ./build.ps1

      # Firma: solo en etiquetas de release y cuando haya certificado.
      # - name: Firmar
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: ...

      - uses: actions/upload-artifact@v4
        with:
          name: KonnorLauncher-Setup
          path: Launcher/artifacts/*.exe

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LauncherBackEnd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencias y compilación
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q main.py Services Panel
          python -c "import main, Panel.app"
