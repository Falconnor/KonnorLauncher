# Konnor Launcher: ajustes del jugador, comunes a todas las instancias.
# Se editan desde Opciones. Las instancias se guardan en %APPDATA%\KonnorLauncher\instances.

# Jugador (nombre de 4 a 16 caracteres: letras, numeros y _)
player.username=
player.skin=

# Java: vacio = el Java correcto para cada version de Minecraft (recomendado)
java.path=
java.memory=4G

# Direccion que se propone al activar "Sincronizar con el servidor" en una instancia nueva
server.url=
